name: QA Auto Merge

on:
  pull_request_review:
    types: [submitted, dismissed]

  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qa-auto-merge
  cancel-in-progress: false

jobs:
  check-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Check and merge QA PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          echo "Checking all PRs with qa-auto-merge label..."

          PRS=$(gh pr list \
            --repo "${{ github.repository }}" \
            --state open \
            --limit 100 \
            --json number,reviewDecision, mergeable)

          echo "$PRS" | jq .

          TOTAL=$(echo "$PRS" | jq 'length')

          if [ "$TOTAL" -eq 0 ]; then
            echo "No QA PRs found."
            exit 0
          fi

          NOT_APPROVED=$(echo "$PRS" | jq \
            '[.[] | select(.reviewDecision != "APPROVED")] | length')

          NOT_MERGEABLE=$(echo "$PRS" | jq \
            '[.[] | select(.mergeable != "MERGEABLE")] | length')

          echo "Total PRs: $TOTAL"
          echo "Not approved: $NOT_APPROVED"
          echo "Not mergeable: $NOT_MERGEABLE"

          if [ "$NOT_APPROVED" -gt 0 ]; then
            echo "❌ Not all PRs are approved."
            echo "❌ No PRs will be merged."
            exit 0
          fi

          if [ "$NOT_MERGEABLE" -gt 0 ]; then
            echo "❌ Not all PRs are mergeable."
            echo "❌ No PRs will be merged."
            exit 0
          fi

          echo "✅ ALL PRs are approved."
          echo "✅ ALL PRs are mergeable."
          echo "🚀 Starting batch merge..."

          echo "$PRS" | jq -r '.[].number' | while read PR_NUMBER; do

            echo "Merging PR #$PR_NUMBER..."

            gh pr merge "$PR_NUMBER" \
              --repo "${{ github.repository }}" \
              --merge \
              --delete-branch

            echo "✅ PR #$PR_NUMBER merged."

          done
